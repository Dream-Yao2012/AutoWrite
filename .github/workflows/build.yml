name: AutoWrite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project AutoWrite.xcodeproj \
            -scheme AutoWrite \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Find App
        run: |
          echo "正在查找生成的 App..."
          find build -name "*.app" -type d

      - name: Package IPA
        run: |
          mkdir -p Payload

          APP_PATH=$(find build -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ 没有找到 .app 文件"
            find build -maxdepth 8 -type d
            exit 1
          fi

          echo "✅ 找到 App：$APP_PATH"

          cp -R "$APP_PATH" Payload/

          zip -r AutoWrite-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AutoWrite-IPA
          path: AutoWrite-unsigned.ipa
